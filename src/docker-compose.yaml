services:

  frontend:
    build:
      context: ./frontend
    container_name: mini-shop-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: mini-shop-backend
    ports:
      - "8000:8000"
    environment:
      CATALOG_URL: http://catalog:8001
    depends_on:
      - catalog

  catalog:
    build:
      context: ./catalog
    container_name: mini-shop-catalog
    ports:
      - "8001:8001"